<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://sbnjodqxvwgqgdnzcziz.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests"><title>관리자 · 시아아빠의 AI작업실</title><link rel="stylesheet" href="assets/app/admin.css"><script type="module" src="assets/app/admin.js"></script></head><body><main>
<header><a href="./">← 작업실로</a><span>시아아빠의 AI작업실</span></header><h1>관리자</h1><p class="muted">방명록과 챌린지 게시글을 관리합니다.</p>
<p id="status" role="status" aria-live="polite">관리자 비밀번호를 입력해 주세요.</p>
<section id="auth-panel"><h2>로그인</h2><form id="login-form"><label>비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="72"></label><button>로그인</button></form>
</section>

<nav id="session-panel" hidden><button id="reload" type="button">목록 새로고침</button><button id="logout" type="button" class="secondary">로그아웃</button><p class="muted">로그인은 이 탭에서만 유지되며, 10분 동안 사용하지 않거나 로그인 후 30분이 지나면 다시 로그인해야 합니다.</p></nav>
<section id="dashboard" hidden><h2>방명록 <small>최근 100건</small></h2><div id="notes"></div><h2>챌린지 게시글 <small>최근 100건</small></h2><div id="posts"></div></section>
<section id="edit-panel" hidden><h2>게시글 수정</h2><form id="edit-form"><input name="id" type="hidden"><label>제목<input name="title" required maxlength="200"></label><label>분류<input name="category" maxlength="40"></label><label>내용<textarea name="content" rows="10" maxlength="20000"></textarea></label><div class="actions"><button>저장</button><button id="cancel-edit" type="button" class="secondary">취소</button></div></form></section>
<footer>숨긴 글은 공개 목록에서 제외되며, 이 화면에서 다시 복원할 수 있습니다. 작품·음악 추가는 저장소에서 관리합니다.</footer>
</main></body></html>
